<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ôn tập Buổi 1–3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: lesson "book" for projector — one long scroll, chapters per tiết, sticky chapter rail on wide screens,
   fixed tool strip (pinyin / nghĩa / cỡ chữ / gọi số / giờ). Light-only, breakfast-shop palette. */
:root{
  color-scheme:light;
  --paper:#FFF8EC; --card:#FFFFFF; --ink:#2A1E14; --muted:#7A6A58; --line:#EADCC6;
  --red:#C7361F; --red-t:#FBE6DF; --green:#2E7D4F; --green-t:#E3F2E8; --blue:#1F5FA8; --blue-t:#E6EFF9; --yolk:#F2B632; --yolk-t:#FFF1CC; --board:#23392C;
  --f-ui:"Be Vietnam Pro","Noto Sans TC",system-ui,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Noto Sans TC",serif;
  --z:1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);margin:0;font-size:calc(18px*var(--z));line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--red)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
.r{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;line-height:1.25;margin:0 .04em}
.r i{font-style:normal;font-family:var(--f-ui);font-size:.46em;color:var(--blue);font-weight:500;letter-spacing:0;white-space:nowrap;line-height:1.3}
.r.p{margin:0}
.nopy .r i{display:none}
.novi .vi{display:none}
.zh{font-family:var(--f-zh)}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--red);color:#fff;box-shadow:0 2px 0 #9E2614}
.top .in{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:1500px;margin:0 auto}
.sign{font-family:var(--f-kai);font-weight:700;font-size:26px;letter-spacing:.12em;white-space:nowrap}
.sign small{font-family:var(--f-ui);font-size:13px;letter-spacing:0;font-weight:600;opacity:.85;margin-left:8px}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{border:0;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
.tool[aria-pressed="true"]{background:#fff;color:var(--red)}
.chips{display:none;gap:6px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 8px;scrollbar-width:none}
.chips a{flex:none;color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px}

/* layout */
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:28px;padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;font-size:14px}
.rail h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.rail a{display:block;color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:6px}
.rail a:hover,.rail a.on{background:var(--yolk-t)}
main{min-width:0;display:grid;gap:26px}
@media (max-width:999px){.wrap{grid-template-columns:1fr}.rail{display:none}.chips{display:flex}.sign small{display:none}}

/* chapter + blocks */
.chap{display:grid;gap:18px;padding-top:6px}
.chap>header{display:flex;align-items:baseline;gap:14px;border-bottom:3px dashed var(--line);padding-bottom:8px}
.chap>header .t{background:var(--ink);color:var(--yolk);font-weight:800;border-radius:8px;padding:4px 12px;font-size:16px}
.chap>header h2{font-family:var(--f-kai);font-size:calc(34px*var(--z))}
.chap>header p{margin:0 0 0 auto;color:var(--muted);font-size:15px}
.blk{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:clamp(16px,2vw,26px);display:grid;gap:14px;min-width:0;box-shadow:0 2px 0 var(--line)}
.blk>.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.blk>.hd h3{font-size:calc(24px*var(--z))}
.badge{font-weight:800;font-size:13px;border-radius:6px;padding:3px 9px;background:var(--yolk);color:var(--ink)}
.badge.r{background:var(--red);color:#fff}.badge.g{background:var(--green);color:#fff}.badge.b{background:var(--blue);color:#fff}
.min{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px}
.how{margin:0;color:var(--muted);font-size:calc(16px*var(--z))}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.say{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.say svg{width:18px;height:18px}
.vi{color:var(--muted);font-size:calc(16px*var(--z))}
.big{font-family:var(--f-zh);font-size:calc(30px*var(--z));line-height:2.1}
.mid{font-family:var(--f-zh);font-size:calc(26px*var(--z));line-height:2.05}
.ans{font-family:var(--f-zh);font-size:calc(24px*var(--z));line-height:2;color:var(--green);background:var(--green-t);border-radius:10px;padding:4px 12px}

/* items */
.list{display:grid;gap:0}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .n{width:36px;height:36px;border-radius:50%;background:var(--yolk-t);color:#7A5300;font-weight:800;display:grid;place-items:center;margin-top:10px}
.it .body{display:grid;gap:4px;min-width:0}
.it .act{display:flex;gap:6px;align-items:center;margin-top:8px}
.it .ans{grid-column:2/-1;justify-self:start}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.vc{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;background:linear-gradient(var(--card),var(--card)) padding-box}
.vc .w{display:flex;align-items:center;gap:10px}
.vc .w .hz{font-family:var(--f-kai);font-size:calc(40px*var(--z));line-height:1.9}
.vc .w .m{font-weight:700;margin-left:auto;text-align:right;font-size:calc(16px*var(--z))}
.vc .ex{font-family:var(--f-zh);font-size:calc(20px*var(--z));line-height:2}
.vc .q3{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:6px}
.vc .qb{flex:none;background:var(--red);color:#fff;font-weight:800;border-radius:6px;padding:0 7px;font-family:var(--f-zh);font-size:15px}
.vc.star{border-color:var(--yolk);box-shadow:inset 4px 0 0 var(--yolk)}

/* MC */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:4px 14px;font-family:var(--f-zh);font-size:calc(22px*var(--z));line-height:1.9;text-align:left}
.opt b{font-family:var(--f-ui);color:var(--muted);margin-right:6px}
.opt.ok{border-color:var(--green);background:var(--green-t)}
.opt.no{border-color:var(--red);background:var(--red-t);text-decoration:line-through}
.opt.vi-o{font-family:var(--f-ui);font-size:calc(18px*var(--z))}
.script{font-family:var(--f-zh);font-size:calc(22px*var(--z));line-height:2;background:var(--paper);border-left:5px solid var(--yolk);border-radius:0 10px 10px 0;padding:4px 12px}

/* formula */
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.formula>span{font-family:var(--f-zh);font-size:calc(26px*var(--z));font-weight:700;background:var(--yolk-t);border:2px solid var(--yolk);border-radius:12px;padding:2px 14px;line-height:2}
.note{background:var(--blue-t);border-radius:12px;padding:10px 14px;display:grid;gap:4px;font-size:calc(16px*var(--z))}
.note b{color:var(--blue)}

/* menu board */
.board{background:var(--board);color:#F5EBD8;border-radius:16px;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;border:6px solid #6B4A2B}
.board h4{font-family:var(--f-kai);font-size:calc(26px*var(--z));margin:0 0 6px;color:var(--yolk)}
.board table{width:100%;border-collapse:collapse;font-family:var(--f-zh);font-size:calc(22px*var(--z))}
.board td{color:#F5EBD8;padding:2px 4px;border-bottom:1px dashed rgba(245,235,216,.25);vertical-align:bottom}
.board td.p{text-align:right;font-family:var(--f-ui);font-weight:800;color:#fff;white-space:nowrap}
.board td.x{font-size:.7em;color:#CDBB9A}
.board .r i{color:#9FD3B4}
.board .promo{grid-column:1/-1;border-top:2px solid rgba(245,235,216,.3);padding-top:10px;font-size:calc(20px*var(--z));display:flex;flex-wrap:wrap;gap:10px 24px;font-family:var(--f-zh)}
.board .promo>span{background:var(--red);color:#fff;border-radius:8px;padding:0 10px}

/* dialogue */
.dlgbox{background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--red);border-radius:14px;padding:10px 20px;font-family:var(--f-zh);font-size:calc(23px*var(--z));line-height:2.1}
.dlgbox p{margin:0}
.dlgbox p b{font-family:var(--f-kai);margin-right:4px}
.dlgbox p.a b{color:var(--red)} .dlgbox p.b b{color:var(--blue)}
.dlgbox.covered p{filter:blur(9px);user-select:none}
#dlg-audio{height:44px;max-width:100%}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;border:2px dashed var(--red);border-radius:14px;padding:10px 14px;font-family:var(--f-zh);font-size:calc(24px*var(--z));font-weight:700;line-height:2}
.bank>span{background:var(--red-t);border-radius:10px;padding:0 12px}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
.th{border:1.5px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.th .n2{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.th .tf{font-family:var(--f-zh);font-weight:700;color:var(--blue);font-size:calc(22px*var(--z));line-height:2}
.th .tv{font-weight:700;font-size:calc(16px*var(--z))}
.th .te{font-family:var(--f-zh);font-size:calc(21px*var(--z));line-height:2}
.th .tw{font-size:calc(15px*var(--z));background:var(--red-t);color:var(--red);border-radius:8px;padding:6px 10px}
.dlg{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:12px}
.ln.a{background:var(--yolk-t)} .ln.b{background:var(--blue-t)}
.ln .who{font-family:var(--f-kai);font-weight:700;font-size:calc(20px*var(--z))}
.ln .t{font-family:var(--f-zh);font-size:calc(23px*var(--z));line-height:2}
.ln.now{outline:3px solid var(--red)}
.covered .ln .t{filter:blur(9px);user-select:none}

/* reading */
.passage{font-family:var(--f-zh);font-size:calc(26px*var(--z));line-height:2.3;text-align:justify}
.frame{display:grid;gap:8px}
.frame .f{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}
.frame .f b{color:var(--red);font-size:15px}
@media (max-width:640px){.frame .f{grid-template-columns:1fr}.it{grid-template-columns:36px 1fr}.it .act{grid-column:2}.ln{grid-template-columns:1fr auto}.ln .who{grid-column:1/-1}}

/* popovers */
.pop{position:fixed;z-index:50;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);width:min(360px,calc(100vw - 32px));background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 40px rgba(42,30,20,.25)}
.pop h3{display:flex;align-items:center;font-size:18px}
.pop h3 button{margin-left:auto;border:0;background:none;font-size:22px}
.pick{font-size:96px;font-weight:900;text-align:center;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.clock{font-size:72px;font-weight:900;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.pop input{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;width:90px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head><body>

<header class="top">
  <div class="in">
    <div class="sign">複習<small>Bài ôn tập Buổi 1–3 · viết vào vở · 2 tiết</small></div>
    <div class="tools">
      <button class="tool" id="t-py" aria-pressed="true">拼音</button>
      <button class="tool" id="t-vi" aria-pressed="true">Nghĩa</button>
      <button class="tool" id="t-sm" aria-label="Chữ nhỏ hơn">A−</button>
      <button class="tool" id="t-lg" aria-label="Chữ lớn hơn">A＋</button>
      <button class="tool" id="t-pick">Gọi số</button>
      <button class="tool" id="t-clock">⏱ <span id="mini">--:--</span></button>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Mục lục"></nav>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Mục lục"></nav>
  <main id="main"></main>
</div>

<div class="pop" id="p-pick" hidden>
  <h3>Gọi số <button data-x aria-label="Đóng">×</button></h3>
  <div class="row"><label for="pmax">Sĩ số</label><input id="pmax" type="number" min="2" max="60" value="30"><button class="btn" id="preset">Làm lại</button></div>
  <div class="pick" id="pnum">—</div>
  <button class="btn p" id="pgo">Gọi số (không trùng)</button>
  <div class="how" id="pleft"></div>
</div>
<div class="pop" id="p-clock" hidden>
  <h3>Đồng hồ <button data-x aria-label="Đóng">×</button></h3>
  <div class="clock" id="clock">0:00</div>
  <div class="row" id="presets"></div>
  <div class="row"><button class="btn p" id="cgo">Bắt đầu</button><button class="btn" id="cpause">Dừng</button></div>

let VOICE=null;function pv(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}catch(e){}}
try{pv();speechSynthesis.onvoiceschanged=pv}catch(e){}
function utt(t,pitch){const u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";u.rate=.82*store.get("rate",1);u.pitch=pitch||1;if(VOICE)u.voice=VOICE;return u}
function speak(t,pitch){try{speechSynthesis.cancel();speechSynthesis.speak(utt(t,pitch))}catch(e){}}

   ${D.P1_ZH.map((w,i)=>`<div class="it"><span class="n">${i+6}</span><div class="body"><div class="big" style="font-family:var(--f-ui);color:var(--blue)">${esc(w[0])}</div></div><div class="act"><button class="btn" data-ans>Đáp án</button></div><div class="ans" hidden>${esc(w[1])}</div></div>`).join("")}</div>`),
 blk("Phần 2 · Chọn từ điền vào câu",write,"10 phút","Chọn từ trong khung, chép cả câu vào vở. Mỗi từ dùng 1 lần, <b>có 2 từ thừa</b>.",
  bank(D.P2_BANK)+numPrac(D.P2)),
 blk("Ôn lý thuyết ngữ pháp Buổi 1–3",`<span class="badge b">Lý thuyết</span>`,"10 phút","Cô đi nhanh từng mẫu: đọc công thức, cả lớp đọc câu ví dụ, nhắc lỗi hay sai. Học sinh <b>không cần chép</b>, chỉ nghe và đọc theo; làm phần 3–5 có thể nhìn lại mục này.",
  `<div class="thgrid">${D.THEORY.map((t,i)=>`<div class="th"><div class="row" style="gap:8px"><span class="n2">${i+1}</span><span class="tf">${R(t[0])}</span></div><div class="tv">${esc(t[1])}</div>${t[2].map(e=>`<div class="row" style="gap:8px;align-items:center"><span class="te">${R(e)}</span>${say(e)}</div>`).join("")}<div class="tw">${esc(t[3])}</div></div>`).join("")}</div>`),
 blk("Phần 3 · Sắp xếp thành câu",write,"10 phút","Sắp xếp các từ thành câu đúng, nhớ thêm dấu câu.",numPrac(D.P3)),
 blk("Phần 4 · Hoàn thành câu",write,"10 phút","Viết tiếp cho đủ câu, nội dung về <b>em</b>. Đáp án là câu ví dụ, em viết khác vẫn đúng nếu đúng ngữ pháp.",numPrac(D.P4))
]);
html+=chap("t2","Tiết 2","閱讀 · 寫作","Phần 5–8 · 50 phút",[
 blk("Phần 5 · Đặt câu",write,"10 phút","Mỗi mẫu đặt <b>1 câu mới</b>. Không chép lại câu ví dụ, chép ví dụ thì không có điểm.",
  `<div class="list">${D.P5.map((x,i)=>`<div class="it"><span class="n">${i+1}</span><div class="body"><div class="mid" style="font-weight:700;color:var(--red)">${R(x[0])}</div><div class="how">Ví dụ: <span class="zh">${R(x[1])}</span></div></div></div>`).join("")}</div>`),
 blk("Phần 6 · Đọc đoạn văn, điền từ",write,"12 phút","Đọc đoạn văn, chọn từ trong khung cho 8 chỗ trống. Có <b>2 từ thừa</b>. Trong vở chỉ cần ghi (1)～(8) và từ.",
  bank(D.P6_BANK)+`<div class="passage">${R(D.P6_TEXT)}</div><div class="row"><button class="btn" id="p6-ans">Đáp án</button><span class="ans" id="p6-out" hidden>${D.P6_ANS.map((w,i)=>`(${i+1}) ${R(w)}`).join("　")}</span></div>`),
 blk("Phần 7 · Đọc bảng giá vé",write,"13 phút","Đọc bảng giá vé, chọn đáp án đúng. Ghi số câu và chữ A/B/C/D vào vở, câu nào có tính thì ghi cả phép tính.",
  `<div class="board"><div><h4>${esc("高雄遊樂園 · 門票")}</h4><table>${D.P7_TABLE.map(r=>`<tr><td>${esc(r[0])}</td><td class="p">${esc(r[1])}</td></tr>`).join("")}</table></div>
   <div class="promo">${D.P7_NOTE.map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>`+mc(D.P7.map(c=>["",c[0],c[1],c[2]]))),
 blk("Phần 8 · Viết đoạn văn: 我在臺灣的生活",write,"15 phút","Viết <b>8–10 câu</b> theo khung 5 phần. Dùng ít nhất <b>4 cấu trúc</b>: V過 · thời gian＋了 · 從A到B · A離B · 從…往… · 要是…就… · 跟…一樣(Adj)，都是… · 因為…所以… · 又…又…",
  `<div class="frame">${D.P8_FRAME.map(f=>`<div class="f"><b>${esc(f[0])}</b><span class="mid">${R(f[1])}</span></div>`).join("")}</div>`)
]);

$("#main").innerHTML=html;
$("#p6-ans").onclick=()=>{$("#p6-out").hidden=!$("#p6-out").hidden};

$$(".say").forEach(b=>{if(!b.innerHTML)b.innerHTML=SPK});

/* nav */
const navHtml=chapters.map(c=>`<h4>${c.t}</h4><a href="#${c.id}">${c.title}</a>`+[...document.querySelectorAll(`#${c.id} .blk`)].map(b=>`<a href="#${b.id}" style="padding-left:18px">${b.dataset.title}</a>`).join("")).join("");
$("#rail").innerHTML=navHtml;
$("#chips").innerHTML=chapters.map(c=>`<a href="#${c.id}">${c.t} · ${c.title}</a>`).join("");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$("#rail a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}}),{rootMargin:"-30% 0px -60% 0px"});
$$(".blk").forEach(b=>io.observe(b));

/* toggles */
function tg(id,cls,key){const b=$(id);let on=store.get(key,true);const ap=()=>{document.body.classList.toggle(cls,!on);b.setAttribute("aria-pressed",on)};b.onclick=()=>{on=!on;store.set(key,on);ap()};ap()}
tg("#t-py","nopy","py");tg("#t-vi","novi","vi");
let z=store.get("z",1);const az=()=>{document.documentElement.style.setProperty("--z",z);store.set("z",z)};az();
$("#t-sm").onclick=()=>{z=Math.max(.75,+(z-.1).toFixed(2));az()};$("#t-lg").onclick=()=>{z=Math.min(1.6,+(z+.1).toFixed(2));az()};

/* clicks */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");if(s){speak(s.dataset.say);return}
  const a=e.target.closest("[data-ans]");if(a){const x=a.closest(".it").querySelector(".ans");x.hidden=!x.hidden;a.textContent=x.hidden?a.dataset.l:"Ẩn";return}
  const sc=e.target.closest("[data-scr]");if(sc){const x=sc.closest(".it").querySelector(".script");x.hidden=!x.hidden;return}
  const o=e.target.closest(".opt");if(o){const it=o.closest("[data-mc]");const ok=+o.dataset.j===+it.dataset.mc;o.classList.add(ok?"ok":"no");return}
  const m=e.target.closest("[data-mcans]");if(m){const it=m.closest("[data-mc]");it.querySelector(`.opt[data-j="${it.dataset.mc}"]`).classList.add("ok");return}
});
$$("[data-ans]").forEach(b=>b.dataset.l=b.textContent);

/* popovers */
const open=id=>{$$(".pop").forEach(p=>p.hidden=p.id!==id?true:!p.hidden)};
$("#t-pick").onclick=()=>open("p-pick");$("#t-clock").onclick=()=>open("p-clock");
$$("[data-open]").forEach(b=>b.addEventListener("click",()=>open("p-"+b.dataset.open)));
$$("[data-x]").forEach(b=>b.onclick=()=>b.closest(".pop").hidden=true);
let pool=[];const pReset=()=>{const n=Math.max(2,Math.min(60,+$("#pmax").value||30));pool=Array.from({length:n},(_,i)=>i+1);$("#pnum").textContent="—";$("#pleft").textContent=`Còn ${pool.length} số`};
$("#preset").onclick=pReset;$("#pmax").onchange=pReset;pReset();
$("#pgo").onclick=()=>{if(!pool.length)pReset();let c=0;const n=+$("#pmax").value||30;const iv=setInterval(()=>{$("#pnum").textContent=1+Math.floor(Math.random()*n);if(++c>12){clearInterval(iv);const v=pool.splice(Math.floor(Math.random()*pool.length),1)[0];$("#pnum").textContent=v;$("#pleft").textContent=`Còn ${pool.length} số`}},55)};
let tLeft=0,tTot=0,tInt=null;const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const tDraw=()=>{$("#clock").textContent=fmt(tLeft);$("#mini").textContent=tTot?fmt(tLeft):"--:--";$("#clock").classList.toggle("low",tTot&&tLeft<=10)};
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.25,A.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+t+.3);o.start(A.currentTime+t);o.stop(A.currentTime+t+.3)})}catch(e){}}
const tStart=s=>{if(s!=null){tTot=s;tLeft=s}clearInterval(tInt);tInt=setInterval(()=>{tLeft--;if(tLeft<=0){tLeft=0;clearInterval(tInt);tInt=null;beep()}tDraw()},1000);tDraw()};
$("#presets").innerHTML=[30,60,180,300,600,900,1200].map(s=>`<button class="btn" data-t="${s}">${s<60?s+"s":s/60+"′"}</button>`).join("");
document.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b&&b.closest(".pop,.blk")){tStart(+b.dataset.t);$("#p-clock").hidden=false;$("#p-pick").hidden=true}});
$("#cgo").onclick=()=>tStart(tLeft>0?null:tTot||60);$("#cpause").onclick=()=>{clearInterval(tInt);tInt=null};tDraw();
</script>

</body></html>
